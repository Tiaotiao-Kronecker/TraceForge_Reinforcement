<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">TraceForge main keypoint grid vs support grid</title>
  <desc id="desc">Comparison between dense main keypoints and support points generated by support_grid_ratio.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 600 17px sans-serif; fill: #334155; }
      .body { font: 15px sans-serif; fill: #475569; }
      .note { font: 14px sans-serif; fill: #64748b; }
      .blue-line { stroke: #3b82f6; stroke-width: 1.4; opacity: 0.35; }
      .blue-dot { fill: #2563eb; }
      .orange-line { stroke: #f59e0b; stroke-width: 1.4; opacity: 0.45; }
      .orange-dot { fill: #d97706; }
      .purple-dot { fill: #7c3aed; }
      .gray-dot { fill: #cbd5e1; }
      .cross { stroke: #94a3b8; stroke-width: 2; }
      .inset { fill: none; stroke: #f59e0b; stroke-width: 2.2; stroke-dasharray: 8 7; }
      .legend-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="520" />

  <text class="title" x="42" y="42">TraceForge outer support_grid_ratio: main keypoints vs support grid</text>
  <text class="body" x="42" y="72">Both are sampled on the local query frame (segment t = 0). Main keypoints use a border-to-border grid; support uses an inset grid, then keeps only depth &gt; 0.</text>

  <rect class="panel" x="34" y="100" width="420" height="340" />
  <rect class="panel" x="490" y="100" width="420" height="340" />
  <rect class="panel" x="946" y="100" width="420" height="340" />

  <text class="subtitle" x="58" y="132">1. Main dense keypoints</text>
  <text class="note" x="58" y="156">Generated by _build_grid_keypoints(): linspace(0, W-1), linspace(0, H-1)</text>

  <text class="subtitle" x="514" y="132">2. Support grid from support_grid_ratio</text>
  <text class="note" x="514" y="156">Generated by get_points_on_a_grid(): inset by margin m = W / 64</text>

  <text class="subtitle" x="970" y="132">3. Overlay and overlap intuition</text>
  <text class="note" x="970" y="156">Exact overlap is possible but rare; rounded-pixel overlap is more common</text>

  <!-- Panel 1 grid -->
  <g transform="translate(70,185)">
    <rect x="0" y="0" width="350" height="220" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
    <g>
      <line class="blue-line" x1="0" y1="0" x2="0" y2="220" />
      <line class="blue-line" x1="58" y1="0" x2="58" y2="220" />
      <line class="blue-line" x1="117" y1="0" x2="117" y2="220" />
      <line class="blue-line" x1="175" y1="0" x2="175" y2="220" />
      <line class="blue-line" x1="233" y1="0" x2="233" y2="220" />
      <line class="blue-line" x1="292" y1="0" x2="292" y2="220" />
      <line class="blue-line" x1="350" y1="0" x2="350" y2="220" />
      <line class="blue-line" x1="0" y1="0" x2="350" y2="0" />
      <line class="blue-line" x1="0" y1="37" x2="350" y2="37" />
      <line class="blue-line" x1="0" y1="73" x2="350" y2="73" />
      <line class="blue-line" x1="0" y1="110" x2="350" y2="110" />
      <line class="blue-line" x1="0" y1="147" x2="350" y2="147" />
      <line class="blue-line" x1="0" y1="183" x2="350" y2="183" />
      <line class="blue-line" x1="0" y1="220" x2="350" y2="220" />
    </g>
    <g>
      <circle class="blue-dot" cx="0" cy="0" r="4.5" />
      <circle class="blue-dot" cx="58" cy="0" r="4.5" />
      <circle class="blue-dot" cx="117" cy="0" r="4.5" />
      <circle class="blue-dot" cx="175" cy="0" r="4.5" />
      <circle class="blue-dot" cx="233" cy="0" r="4.5" />
      <circle class="blue-dot" cx="292" cy="0" r="4.5" />
      <circle class="blue-dot" cx="350" cy="0" r="4.5" />
      <circle class="blue-dot" cx="0" cy="37" r="4.5" />
      <circle class="blue-dot" cx="58" cy="37" r="4.5" />
      <circle class="blue-dot" cx="117" cy="37" r="4.5" />
      <circle class="blue-dot" cx="175" cy="37" r="4.5" />
      <circle class="blue-dot" cx="233" cy="37" r="4.5" />
      <circle class="blue-dot" cx="292" cy="37" r="4.5" />
      <circle class="blue-dot" cx="350" cy="37" r="4.5" />
      <circle class="blue-dot" cx="0" cy="73" r="4.5" />
      <circle class="blue-dot" cx="58" cy="73" r="4.5" />
      <circle class="blue-dot" cx="117" cy="73" r="4.5" />
      <circle class="blue-dot" cx="175" cy="73" r="4.5" />
      <circle class="blue-dot" cx="233" cy="73" r="4.5" />
      <circle class="blue-dot" cx="292" cy="73" r="4.5" />
      <circle class="blue-dot" cx="350" cy="73" r="4.5" />
      <circle class="blue-dot" cx="0" cy="110" r="4.5" />
      <circle class="blue-dot" cx="58" cy="110" r="4.5" />
      <circle class="blue-dot" cx="117" cy="110" r="4.5" />
      <circle class="blue-dot" cx="175" cy="110" r="4.5" />
      <circle class="blue-dot" cx="233" cy="110" r="4.5" />
      <circle class="blue-dot" cx="292" cy="110" r="4.5" />
      <circle class="blue-dot" cx="350" cy="110" r="4.5" />
      <circle class="blue-dot" cx="0" cy="147" r="4.5" />
      <circle class="blue-dot" cx="58" cy="147" r="4.5" />
      <circle class="blue-dot" cx="117" cy="147" r="4.5" />
      <circle class="blue-dot" cx="175" cy="147" r="4.5" />
      <circle class="blue-dot" cx="233" cy="147" r="4.5" />
      <circle class="blue-dot" cx="292" cy="147" r="4.5" />
      <circle class="blue-dot" cx="350" cy="147" r="4.5" />
      <circle class="blue-dot" cx="0" cy="183" r="4.5" />
      <circle class="blue-dot" cx="58" cy="183" r="4.5" />
      <circle class="blue-dot" cx="117" cy="183" r="4.5" />
      <circle class="blue-dot" cx="175" cy="183" r="4.5" />
      <circle class="blue-dot" cx="233" cy="183" r="4.5" />
      <circle class="blue-dot" cx="292" cy="183" r="4.5" />
      <circle class="blue-dot" cx="350" cy="183" r="4.5" />
      <circle class="blue-dot" cx="0" cy="220" r="4.5" />
      <circle class="blue-dot" cx="58" cy="220" r="4.5" />
      <circle class="blue-dot" cx="117" cy="220" r="4.5" />
      <circle class="blue-dot" cx="175" cy="220" r="4.5" />
      <circle class="blue-dot" cx="233" cy="220" r="4.5" />
      <circle class="blue-dot" cx="292" cy="220" r="4.5" />
      <circle class="blue-dot" cx="350" cy="220" r="4.5" />
    </g>
    <text class="body" x="10" y="246">Touches image borders</text>
    <text class="body" x="10" y="268">No support-specific depth&gt;0 prefilter here</text>
  </g>

  <!-- Panel 2 support grid -->
  <g transform="translate(526,185)">
    <rect x="0" y="0" width="350" height="220" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" />
    <rect class="inset" x="28" y="28" width="294" height="164" />
    <g>
      <line class="orange-line" x1="28" y1="28" x2="28" y2="192" />
      <line class="orange-line" x1="101.5" y1="28" x2="101.5" y2="192" />
      <line class="orange-line" x1="175" y1="28" x2="175" y2="192" />
      <line class="orange-line" x1="248.5" y1="28" x2="248.5" y2="192" />
      <line class="orange-line" x1="322" y1="28" x2="322" y2="192" />
      <line class="orange-line" x1="28" y1="28" x2="322" y2="28" />
      <line class="orange-line" x1="28" y1="69" x2="322" y2="69" />
      <line class="orange-line" x1="28" y1="110" x2="322" y2="110" />
      <line class="orange-line" x1="28" y1="151" x2="322" y2="151" />
      <line class="orange-line" x1="28" y1="192" x2="322" y2="192" />
    </g>
    <g>
      <circle class="orange-dot" cx="28" cy="28" r="5" />
      <circle class="orange-dot" cx="101.5" cy="28" r="5" />
      <circle class="orange-dot" cx="175" cy="28" r="5" />
      <circle class="orange-dot" cx="248.5" cy="28" r="5" />
      <circle class="orange-dot" cx="322" cy="28" r="5" />

      <circle class="orange-dot" cx="28" cy="69" r="5" />
      <circle class="orange-dot" cx="101.5" cy="69" r="5" />
      <circle class="gray-dot" cx="175" cy="69" r="5" />
      <line class="cross" x1="167" y1="61" x2="183" y2="77" />
      <line class="cross" x1="183" y1="61" x2="167" y2="77" />
      <circle class="orange-dot" cx="248.5" cy="69" r="5" />
      <circle class="orange-dot" cx="322" cy="69" r="5" />

      <circle class="orange-dot" cx="28" cy="110" r="5" />
      <circle class="orange-dot" cx="101.5" cy="110" r="5" />
      <circle class="orange-dot" cx="175" cy="110" r="5" />
      <circle class="orange-dot" cx="248.5" cy="110" r="5" />
      <circle class="orange-dot" cx="322" cy="110" r="5" />

      <circle class="orange-dot" cx="28" cy="151" r="5" />
      <circle class="gray-dot" cx="101.5" cy="151" r="5" />
      <line class="cross" x1="93.5" y1="143" x2="109.5" y2="159" />
      <line class="cross" x1="109.5" y1="143" x2="93.5" y2="159" />
      <circle class="orange-dot" cx="175" cy="151" r="5" />
      <circle class="orange-dot" cx="248.5" cy="151" r="5" />
      <circle class="orange-dot" cx="322" cy="151" r="5" />

      <circle class="orange-dot" cx="28" cy="192" r="5" />
      <circle class="orange-dot" cx="101.5" cy="192" r="5" />
      <circle class="orange-dot" cx="175" cy="192" r="5" />
      <circle class="orange-dot" cx="248.5" cy="192" r="5" />
      <circle class="orange-dot" cx="322" cy="192" r="5" />
    </g>
    <text class="body" x="10" y="246">Inset grid, not border-to-border</text>
    <text class="body" x="10" y="268">Sample depth on query frame, keep only depth &gt; 0</text>
  </g>

  <!-- Panel 3 overlay -->
  <g transform="translate(982,185)">
    <rect x="0" y="0" width="350" height="220" fill="#faf5ff" stroke="#ddd6fe" stroke-width="2" />
    <g opacity="0.33">
      <line class="blue-line" x1="0" y1="0" x2="0" y2="220" />
      <line class="blue-line" x1="58" y1="0" x2="58" y2="220" />
      <line class="blue-line" x1="117" y1="0" x2="117" y2="220" />
      <line class="blue-line" x1="175" y1="0" x2="175" y2="220" />
      <line class="blue-line" x1="233" y1="0" x2="233" y2="220" />
      <line class="blue-line" x1="292" y1="0" x2="292" y2="220" />
      <line class="blue-line" x1="350" y1="0" x2="350" y2="220" />
      <line class="blue-line" x1="0" y1="0" x2="350" y2="0" />
      <line class="blue-line" x1="0" y1="37" x2="350" y2="37" />
      <line class="blue-line" x1="0" y1="73" x2="350" y2="73" />
      <line class="blue-line" x1="0" y1="110" x2="350" y2="110" />
      <line class="blue-line" x1="0" y1="147" x2="350" y2="147" />
      <line class="blue-line" x1="0" y1="183" x2="350" y2="183" />
      <line class="blue-line" x1="0" y1="220" x2="350" y2="220" />
    </g>
    <g opacity="0.55">
      <line class="orange-line" x1="28" y1="28" x2="28" y2="192" />
      <line class="orange-line" x1="101.5" y1="28" x2="101.5" y2="192" />
      <line class="orange-line" x1="175" y1="28" x2="175" y2="192" />
      <line class="orange-line" x1="248.5" y1="28" x2="248.5" y2="192" />
      <line class="orange-line" x1="322" y1="28" x2="322" y2="192" />
      <line class="orange-line" x1="28" y1="28" x2="322" y2="28" />
      <line class="orange-line" x1="28" y1="69" x2="322" y2="69" />
      <line class="orange-line" x1="28" y1="110" x2="322" y2="110" />
      <line class="orange-line" x1="28" y1="151" x2="322" y2="151" />
      <line class="orange-line" x1="28" y1="192" x2="322" y2="192" />
    </g>
    <g>
      <circle class="blue-dot" cx="58" cy="37" r="4" />
      <circle class="blue-dot" cx="117" cy="73" r="4" />
      <circle class="blue-dot" cx="175" cy="110" r="4" />
      <circle class="blue-dot" cx="233" cy="147" r="4" />
      <circle class="blue-dot" cx="292" cy="183" r="4" />

      <circle class="orange-dot" cx="28" cy="28" r="5" />
      <circle class="orange-dot" cx="101.5" cy="69" r="5" />
      <circle class="orange-dot" cx="175" cy="110" r="5" />
      <circle class="orange-dot" cx="248.5" cy="151" r="5" />
      <circle class="orange-dot" cx="322" cy="192" r="5" />

      <circle class="purple-dot" cx="175" cy="110" r="7.5" />
      <circle cx="101.5" cy="69" r="8.5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4" />
    </g>
    <text class="body" x="10" y="246">Solid purple: possible exact XY overlap</text>
    <text class="body" x="10" y="268">Dashed purple ring: same rounded depth pixel, but XY can still differ</text>
  </g>

  <g transform="translate(52,454)">
    <rect class="legend-box" x="0" y="-14" width="1296" height="42" />
    <circle class="blue-dot" cx="18" cy="7" r="5" />
    <text class="body" x="32" y="12">main dense keypoint candidate</text>
    <circle class="orange-dot" cx="250" cy="7" r="5" />
    <text class="body" x="264" y="12">support-grid candidate before depth filtering</text>
    <circle class="gray-dot" cx="578" cy="7" r="5" />
    <line class="cross" x1="570" y1="-1" x2="586" y2="15" />
    <line class="cross" x1="586" y1="-1" x2="570" y2="15" />
    <text class="body" x="596" y="12">filtered out because query-frame depth is invalid</text>
    <circle class="purple-dot" cx="1038" cy="7" r="6" />
    <text class="body" x="1054" y="12">possible overlap between the two sets</text>
  </g>
</svg>
